# A demonstration profile for stereo streams (modern track, docs/adr/0005):
# the dissertation's feature set plus depth and onset, selected by the 2D neural
# field with the dissertation system's parameters, feeding the object-file
# second stage. Used by the stereo-stream test and by the visualization plan
# (docs/DEMO_STEREO_SCENE.md).
#
#   ./attention --attend <left_dir> --right <right_dir> --config configs/demo_stereo.yaml \
#       --emit-trace results/trace
#
# Not a thesis profile: it combines stereo and onset, which configs/thesis/
# keeps in separate profiles, and it is free to change.
pipeline:
  fusion: weighted-sum
  selection: neural-field
  selection_params:
    alpha: 0.33
    beta: 30.0
    resting: -0.33
    # Measured on this scene over the whole take, not inherited. Two separate
    # effects, which looked like one until they were measured apart:
    #   input_mult 0.765 -> 1.0 is what lets the revealed box form a cluster at
    #     all (at 0.765 it never does, despite saliency 0.78 -- the equal of the
    #     two near figures);
    #   global_mult 8.0 -> 5.0 is what lets it *rank*, from carded on 7% of its
    #     visible frames to 100%.
    # Lowering global_mult further is not better: at 3.0 the field holds 18
    # clusters instead of 14, and the box falls out of the five most salient
    # again (carded 5%). The extra clusters are legs, arms and torsos -- the
    # field segments parts, not people. See docs/DEMO_STEREO_SCENE.md section 6b.
    global_mult: 5.0
    kernel_size: 15
    kernel_s: 3.3
    kernel_k: 0.12
    kernel_s2: 14.0
    kernel_k2: 0.03
    field_max_size: 96
    cycles_per_frame: 20
    input_mult: 1.0    # see global_mult above
features:
  color-munsell:
    weight: 1.0
  eccentricity:
    weight: 1.0
  symmetry:
    weight: 1.0
  stereo:
    weight: 1.0
  onset:
    weight: 1.0
  color:
    enabled: false
  intensity:
    enabled: false
  orientation:
    enabled: false
output:
  output_dir: "results/"
  display: false

# The second stage builds its object files from the neural field's activity
# clusters rather than from thresholded saliency — the thesis's own chain
# (ch. 6 -> 7.2.2), and the thing that keeps render grain and background texture
# from each becoming an object file. Correspondence follows thesis 7.2.3.
attention_system:
  cluster_source: field
  object_files:
    correspondence: thesis
    correspondence_radius: 40
