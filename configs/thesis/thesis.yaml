# Thesis track (docs/adr/0005): only components that implement the dissertation
# belong here; the modern track (configs/modern.yaml and everything else under
# configs/) is free to move away from it.
#
# Thesis profile: the feature set of the original dissertation
# (Backer 2004), loosely equivalent by design (see docs/V2_ROADMAP.md).
#
# The original static features were colour contrast, eccentricity, and
# symmetry (stereo and onset: configs/thesis/stereo.yaml, configs/thesis/attend.yaml).
#  - color-munsell is the thesis's colour feature (MTM/Munsell segmentation
#    contrast, §5.3.2). `color` — like intensity and orientation — is an
#    Itti-Koch-style addition of the reimplementation and stays disabled here.
#  - exclusivity 1.1 is the thesis's odd-man-popout weighting (§5.5.3, "1.1 for
#    all features in all experiments"); symmetry has no categories to weight.
#
# Selection: two-stage neural-field selection (roadmap M3) — 2D Amari field
# dynamics ported from the dissertation's nf2d, with the cluster/Objectfile
# readout of thesis chapters 6/7 in minimal form. Parameters are the original
# code defaults; the thesis itself is qualitative about most of them.

pipeline:
  fusion: weighted-sum
  selection: neural-field
  selection_params:
    alpha: 0.5
    beta: 30.0
    resting: -0.25
    global_mult: 1.0
    kernel_s: 5.0
    kernel_k: 0.06
    max_cycles: 55        # thesis: cutoff 55 cycles, ~10 typical
    change_thresh: 0.02   # thesis: mean |du| < 0.02
    ior_decay: 0.8        # thesis: inhibition reduced 20% per frame

features:
  color-munsell:
    weight: 1.0
    params:
      exclusivity: 1.1
  eccentricity:
    weight: 1.0
    params:
      exclusivity: 1.1
  symmetry:
    weight: 1.0
  color:
    enabled: false
  intensity:
    enabled: false
  orientation:
    enabled: false

# Note: neural-field selection reads only max_count and ior_strength (the
# space-based IOR level); the field itself decides what is salient enough
peaks:
  max_count: 10
  ior_strength: 0.8

output:
  output_dir: "results/"
  display: false
