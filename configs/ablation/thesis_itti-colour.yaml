# Ablation arm: thesis profile, colour feature swapped: Itti-Koch `color` for `color-munsell`.
# One change at a time against configs/thesis/thesis.yaml (neural-field parameters as
# there); results and reading: docs/FEATURE_ASSESSMENT.md, "Ablation".

pipeline:
  fusion: weighted-sum
  selection: neural-field
  selection_params:
    alpha: 0.5
    beta: 30.0
    resting: -0.25
    global_mult: 1.0
    kernel_s: 5.0
    kernel_k: 0.06
    max_cycles: 55
    change_thresh: 0.02
    ior_decay: 0.8

peaks:
  max_count: 10
  ior_strength: 0.8

features:
  color-munsell:
    enabled: false
  eccentricity:
    weight: 1.0
    params:
      exclusivity: 1.1
  symmetry:
    weight: 1.0
  color:
    weight: 1.0
  intensity:
    enabled: false
  orientation:
    enabled: false
