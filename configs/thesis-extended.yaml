# Thesis-extended profile (until 2026-09 named modern.yaml, which it never was):
# the reimplementation's original five features — Itti-Koch-style colour,
# intensity and orientation next to eccentricity and symmetry — with NMS
# selection. Kept as a comparison arm: on V*Bench its fixations cover question
# targets no better than random ones (docs/FEATURE_ASSESSMENT.md).
# `configs/modern.yaml` is the best modern profile we know how to build.

pipeline:
  fusion: weighted-sum
  selection: nms

features:
  color:
    weight: 1.0
  intensity:
    weight: 1.0
  orientation:
    weight: 1.0
  eccentricity:
    weight: 1.0
  symmetry:
    weight: 1.0

peaks:
  min_distance: 30
  threshold: 0.3
  max_count: 10

output:
  output_dir: "results/"
  display: false
